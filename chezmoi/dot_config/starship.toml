format = "$directory$git_branch$git_status$character"
right_format = "$cmd_duration"
add_newline = true
palette = "glass"

[palettes.glass]
bright = "#f2f2f2"
soft = "#b8b8bc"
muted = "#77777f"
dim = "#4e4e56"

[directory]
style = "bold bright"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
style = "soft"
format = "[$symbol$branch]($style) "
symbol = " "

[git_status]
style = "soft"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
style = "muted"
format = "[$duration]($style)"
min_time = 1000

[character]
success_symbol = "[❯](bright)"
error_symbol = "[❯](soft)"
vimcmd_symbol = "[❮](bright)"
